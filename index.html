<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">رسم‌گر پیشرفته توابع ریاضی</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --hint-color: var(--tg-theme-hint-color, #708499);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .input-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0 10px;
    }
    .prefix {
      font-family: monospace;
      font-size: 1.1rem;
      color: var(--hint-color);
      margin-left: 6px;
      margin-right: 6px;
    }
    input {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 0;
      font-size: 1.1rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }
    button.action-btn {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.action-btn:active {
      opacity: 0.8;
    }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: monospace;
      direction: ltr;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .chart-container {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 12px;
      position: relative;
      height: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 رسم‌گر توابع ریاضی</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN / فارسی</button>
  </div>
  
  <div class="input-card">
    <label id="labelEq" for="equation">عبارت تابع را وارد کنید:</label>
    <div class="input-row">
      <span class="prefix">y =</span>
      <input type="text" id="equation" value="3*x + 2" placeholder="3*x + 2">
    </div>
    <div class="error-msg" id="errorMsg"></div>
    
    <label id="labelExamples" style="font-size: 0.8rem; opacity: 0.7; margin-top: -4px;">نمونه‌های سریع (کلیک کنید):</label>
    <div class="examples">
      <span class="chip" onclick="setEq('3*x + 2')">3*x + 2</span>
      <span class="chip" onclick="setEq('x**2 - 4')">x**2 - 4</span>
      <span class="chip" onclick="setEq('Math.sin(x)')">Math.sin(x)</span>
      <span class="chip" onclick="setEq('Math.sin(x) * x')">Math.sin(x) * x</span>
    </div>

    <button class="action-btn" id="plotBtn" onclick="plot()">رسم نمودار</button>
  </div>

  <div class="chart-container">
    <canvas id="mathChart"></canvas>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';

    const translations = {
      fa: {
        title: "📐 رسم‌گر توابع ریاضی",
        labelEq: "عبارت تابع را وارد کنید:",
        labelExamples: "نمونه‌های سریع (کلیک کنید):",
        plotBtn: "رسم نمودار",
        langBtn: "English",
        axisX: "محور X",
        axisY: "محور Y",
        error: "خطا در فرمول! لطفاً عبارت درستی وارد کنید (مثلا 3*x + 2)"
      },
      en: {
        title: "📐 Math Function Plotter",
        labelEq: "Enter function expression:",
        labelExamples: "Quick examples (click to test):",
        plotBtn: "Plot Function",
        langBtn: "فارسی",
        axisX: "X Axis",
        axisY: "Y Axis",
        error: "Invalid formula! Please enter a valid expression (e.g. 3*x + 2)"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('labelEq').textContent = t.labelEq;
      document.getElementById('labelExamples').textContent = t.labelExamples;
      document.getElementById('plotBtn').textContent = t.plotBtn;
      document.getElementById('langBtn').textContent = t.langBtn;
      
      plot();
    }

    let chart = null;

    function setEq(eq) {
      document.getElementById('equation').value = eq;
      plot();
    }

    function preprocessExpression(expr) {
      let jsExpr = expr
        .replace(/\^/g, '**')
        .replace(/(\d)([a-zA-Z\(])/g, '$1*$2') // 3x -> 3*x
        .replace(/([x\)])(\d)/g, '$1*$2');   // x2 -> x*2
      return jsExpr;
    }

    function plot() {
      const rawInput = document.getElementById('equation').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';

      const xValues = [];
      const yValues = [];

      try {
        const processed = preprocessExpression(rawInput);
        const fn = new Function('x', `try { return ${processed}; } catch(e) { return NaN; }`);

        for (let x = -10; x <= 10; x += 1) {
          xValues.push(x);
          let y = fn(x);
          yValues.push(isNaN(y) ? null : y);
        }

        if (chart) chart.destroy();

        const t = translations[currentLang];
        const ctx = document.getElementById('mathChart').getContext('2d');
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: xValues,
            datasets: [{
              label: `y = ${rawInput}`,
              data: yValues,
              borderColor: '#5288c1',
              backgroundColor: 'rgba(82, 136, 193, 0.1)',
              borderWidth: 2.5,
              pointRadius: 3,
              fill: true,
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                title: { display: true, text: t.axisX, color: '#708499' },
                grid: { color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.08)" },
                ticks: { stepSize: 1, color: '#708499' }
              },
              y: {
                title: { display: true, text: t.axisY, color: '#708499' },
                grid: { color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.08)" },
                ticks: { color: '#708499' }
              }
            }
          }
        });
      } catch (e) {
        errorEl.textContent = translations[currentLang].error;
      }
    }

    // Initial plot on load
    window.onload = function() {
      plot();
    };
  </script>
</body>
</html>
