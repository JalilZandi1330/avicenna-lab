<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">جئوجبرا پلاس پرو | GeoGebra Plus Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1e1e2e);
      --text-color: var(--tg-theme-text-color, #cdd6f4);
      --button-color: var(--tg-theme-button-color, #89b4fa);
      --button-text: var(--tg-theme-button-text-color, #11111b);
      --card-bg: var(--tg-theme-secondary-bg-color, #313244);
      --hint-color: var(--tg-theme-hint-color, #6c7086);
      --axis-color: #585b70;
      --grid-color: rgba(88, 91, 112, 0.15);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }
    h2 { margin: 0; font-size: 1rem; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background: #11111b;
      overflow: hidden;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .coords-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(17, 17, 27, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      pointer-events: none;
      color: var(--button-color);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .bottom-panel {
      background: var(--card-bg);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0 10px;
    }
    .input-row.focused { border-color: var(--button-color); }
    .prefix { font-family: monospace; color: var(--hint-color); margin-right: 8px; }
    input {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 0;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
    }
    .math-keyboard {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .kb-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-color);
      border-radius: 4px;
      padding: 8px 0;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: monospace;
      text-align: center;
    }
    .kb-btn:active { background: var(--button-color); color: var(--button-text); }
    .toolbar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: var(--text-color);
      cursor: pointer;
      white-space: nowrap;
    }
    .tool-btn.active { background: var(--button-color); color: var(--button-text); border-color: transparent; }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 جئوجبرا پلاس پرو | GeoGebra Plus Pro</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
  </div>

  <div class="canvas-container" id="canvasBox">
    <div class="coords-overlay" id="coordsOverlay">x: 0.00, y: 0.00</div>
    <canvas id="geoCanvas"></canvas>
  </div>

  <div class="bottom-panel">
    <div class="toolbar">
      <button class="tool-btn active" id="btnGrid" onclick="toggleTool('grid')">شبکه</button>
      <button class="tool-btn active" id="btnRoots" onclick="toggleTool('roots')">ریشه‌ها/برخورد</button>
      <button class="tool-btn" id="btnReset" onclick="resetZoom()">مرکز</button>
      <div style="flex:1"></div>
      <div id="aValDisplay" style="font-size: 0.75rem; font-family: monospace; color: var(--button-color)">a = 1.0</div>
    </div>
    
    <div class="input-section">
      <div class="input-row" id="row1">
        <span class="prefix">f(x)=</span>
        <input type="text" id="eq1" value="xx - 4" onfocus="setActiveInput('eq1')" oninput="draw()" readonly>
      </div>
      <div class="input-row" id="row2">
        <span class="prefix">g(x)=</span>
        <input type="text" id="eq2" value="2x" onfocus="setActiveInput('eq2')" oninput="draw()" readonly>
      </div>
    </div>

    <!-- Custom Math Keyboard -->
    <div class="math-keyboard">
      <button class="kb-btn" onclick="kbInsert('x')">x</button>
      <button class="kb-btn" onclick="kbInsert('xx')">x²</button>
      <button class="kb-btn" onclick="kbInsert('^')">^</button>
      <button class="kb-btn" onclick="kbInsert('|')">| |</button>
      <button class="kb-btn" onclick="kbInsert('√(')">√</button>
      <button class="kb-btn" onclick="kbInsert('/')">/</button>
      
      <button class="kb-btn" onclick="kbInsert('sin(')">sin</button>
      <button class="kb-btn" onclick="kbInsert('cos(')">cos</button>
      <button class="kb-btn" onclick="kbInsert('tan(')">tan</button>
      <button class="kb-btn" onclick="kbInsert('(')">(</button>
      <button class="kb-btn" onclick="kbInsert(')')">)</button>
      <button class="kb-btn" style="color:#f38ba8" onclick="kbBackspace()">⌫</button>
      
      <button class="kb-btn" onclick="kbInsert('7')">7</button>
      <button class="kb-btn" onclick="kbInsert('8')">8</button>
      <button class="kb-btn" onclick="kbInsert('9')">9</button>
      <button class="kb-btn" onclick="kbInsert('+')">+</button>
      <button class="kb-btn" onclick="kbInsert('-')">-</button>
      <button class="kb-btn" onclick="kbInsert('*')">×</button>
      
      <button class="kb-btn" onclick="kbInsert('4')">4</button>
      <button class="kb-btn" onclick="kbInsert('5')">5</button>
      <button class="kb-btn" onclick="kbInsert('6')">6</button>
      <button class="kb-btn" onclick="kbInsert('1')">1</button>
      <button class="kb-btn" onclick="kbInsert('2')">2</button>
      <button class="kb-btn" onclick="kbInsert('3')">3</button>

      <button class="kb-btn" onclick="kbInsert('0')">0</button>
      <button class="kb-btn" onclick="kbInsert('.')">.</button>
      <button class="kb-btn" style="grid-column: span 2; background: var(--button-color); color: var(--button-text)" onclick="draw()">OK</button>
      <button class="kb-btn" style="grid-column: span 2; color:#f38ba8" onclick="kbClear()">CLR</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';
    let showGrid = true;
    let showRoots = true;
    let activeInputId = 'eq1';

    let scale = 40;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let startX, startY;

    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.getElementById('canvasBox');

    const translations = {
      fa: {
        title: "📐 جئوجبرا پلاس پرو | GeoGebra Plus Pro",
        langBtn: "English",
        grid: "شبکه",
        roots: "ریشه‌ها",
        reset: "مرکز",
        error: "فرمول نامعتبر!"
      },
      en: {
        title: "📐 GeoGebra Plus Pro",
        langBtn: "فارسی",
        grid: "Grid",
        roots: "Analysis",
        reset: "Reset",
        error: "Invalid!"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('btnGrid').textContent = t.grid;
      document.getElementById('btnRoots').textContent = t.roots;
      document.getElementById('btnReset').textContent = t.reset;
      draw();
    }

    function setActiveInput(id) {
      activeInputId = id;
      document.getElementById('row1').classList.toggle('focused', id === 'eq1');
      document.getElementById('row2').classList.toggle('focused', id === 'eq2');
    }

    function kbInsert(val) {
      const el = document.getElementById(activeInputId);
      el.value += val;
      draw();
    }

    function kbBackspace() {
      const el = document.getElementById(activeInputId);
      el.value = el.value.slice(0, -1);
      draw();
    }

    function kbClear() {
      document.getElementById(activeInputId).value = "";
      draw();
    }

    function toggleTool(tool) {
      if (tool === 'grid') {
        showGrid = !showGrid;
        document.getElementById('btnGrid').classList.toggle('active', showGrid);
      } else if (tool === 'roots') {
        showRoots = !showRoots;
        document.getElementById('btnRoots').classList.toggle('active', showRoots);
      }
      draw();
    }

    function resetZoom() {
      scale = 40; offsetX = 0; offsetY = 0;
      draw();
    }

    function resizeCanvas() {
      canvas.width = box.clientWidth;
      canvas.height = box.clientHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const cx = canvas.width/2 + offsetX;
      const cy = canvas.height/2 + offsetY;
      const mx = (px - cx) / scale;
      const my = (cy - py) / scale;
      document.getElementById('coordsOverlay').textContent = `x: ${mx.toFixed(2)}, y: ${my.toFixed(2)}`;

      if (isDragging) {
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        draw();
      }
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.max(10, Math.min(300, scale * factor));
      draw();
    }, {passive: false});

    // Touch Support
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - offsetX;
        startY = e.touches[0].clientY - offsetY;
      }
    });
    canvas.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        offsetX = e.touches[0].clientX - startX;
        offsetY = e.touches[0].clientY - startY;
        draw();
      }
    });
    canvas.addEventListener('touchend', () => isDragging = false);

    function preprocess(expr) {
      if (!expr || !expr.trim()) return null;
      return expr.toLowerCase()
        .replace(/xx/g, 'x**2')
        .replace(/\^/g, '**')
        .replace(/√\(([^)]+)\)/g, 'Math.sqrt($1)')
        .replace(/√(\w+)/g, 'Math.sqrt($1)')
        .replace(/\|([^|]+)\|/g, 'Math.abs($1)')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/tan/g, 'Math.tan')
        .replace(/(\d)([a-z\(|])/g, '$1*$2')
        .replace(/([x\)])(\d)/g, '$1*$2');
    }

    function evalFn(expr, x) {
      const p = preprocess(expr);
      if (!p) return null;
      try {
        const fn = new Function('x', `return ${p};`);
        let v = fn(x);
        return isFinite(v) ? v : null;
      } catch(e) { return null; }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width/2 + offsetX;
      const cy = canvas.height/2 + offsetY;

      // 1. Grid
      if (showGrid) {
        ctx.strokeStyle = 'rgba(88, 91, 112, 0.15)';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#6c7086';
        ctx.font = '10px monospace';

        let startX = cx % scale;
        for (let x = startX; x < canvas.width; x += scale) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          let mx = Math.round((x - cx) / scale);
          if (mx !== 0) ctx.fillText(mx, x - 6, cy + 12);
        }

        let startY = cy % scale;
        for (let y = startY; y < canvas.height; y += scale) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
          let my = Math.round((cy - y) / scale);
          if (my !== 0) ctx.fillText(my, cx + 6, y + 4);
        }
      }

      // 2. Axes
      ctx.strokeStyle = '#a6adc8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

      // 3. Curves
      const eq1 = document.getElementById('eq1').value;
      const eq2 = document.getElementById('eq2').value;

      function plot(expr, color) {
        if (!expr.trim()) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        let first = true;
        for (let px = 0; px <= canvas.width; px += 1) {
          let mx = (px - cx) / scale;
          let my = evalFn(expr, mx);
          if (my === null) { first = true; continue; }
          let py = cy - my * scale;
          if (first) { ctx.moveTo(px, py); first = false; }
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      plot(eq1, '#89b4fa');
      plot(eq2, '#f38ba8');

      // 4. Analysis (Roots & Intersections)
      if (showRoots) {
        const step = 0.1;
        for (let mx = -canvas.width/(2*scale)-offsetX/scale; mx <= canvas.width/(2*scale)-offsetX/scale; mx += step) {
          let y1 = evalFn(eq1, mx);
          let y2 = evalFn(eq2, mx);

          // Root of f(x)
          if (y1 !== null && Math.abs(y1) < 0.1) {
            ctx.fillStyle = '#a6e3a1';
            ctx.beginPath(); ctx.arc(cx + mx * scale, cy, 5, 0, 7); ctx.fill();
          }
          // Intersection
          if (y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.15) {
            ctx.fillStyle = '#cba6f7';
            ctx.beginPath(); ctx.arc(cx + mx * scale, cy - y1 * scale, 6, 0, 7); ctx.fill();
          }
        }
      }
    }

    setActiveInput('eq1');
    window.onload = resizeCanvas;
  </script>
</body>
</html>
