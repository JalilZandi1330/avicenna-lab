<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">رسم‌گر پیشرفته توابع ریاضی</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --hint-color: var(--tg-theme-hint-color, #708499);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .input-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0 10px;
    }
    .prefix {
      font-family: monospace;
      font-size: 1.1rem;
      color: var(--hint-color);
      margin-left: 6px;
      margin-right: 6px;
    }
    input {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 0;
      font-size: 1.1rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }
    button.action-btn {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.action-btn:active {
      opacity: 0.8;
    }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: monospace;
      direction: ltr;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .chart-container {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 12px;
      position: relative;
      height: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .info-panel {
      font-size: 0.8rem;
      color: var(--hint-color);
      background: rgba(0,0,0,0.15);
      padding: 8px;
      border-radius: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 رسم‌گر پیشرفته توابع ریاضی</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN / فارسی</button>
  </div>
  
  <div class="input-card">
    <label id="labelEq1" for="equation1">تابع اول f(x):</label>
    <div class="input-row">
      <span class="prefix">f(x) =</span>
      <input type="text" id="equation1" value="xx - 4" placeholder="xx - 4">
    </div>

    <label id="labelEq2" for="equation2" style="margin-top: 4px;">تابع دوم g(x) (اختیاری):</label>
    <div class="input-row">
      <span class="prefix">g(x) =</span>
      <input type="text" id="equation2" value="2x" placeholder="2x">
    </div>

    <div class="error-msg" id="errorMsg"></div>
    
    <label id="labelExamples" style="font-size: 0.8rem; opacity: 0.7;">نمونه‌های سریع:</label>
    <div class="examples">
      <span class="chip" onclick="setEqs('xx - 4', '2x')">xx - 4 &amp; 2x</span>
      <span class="chip" onclick="setEqs('3x + 2', '-x + 3')">3x + 2 &amp; -x + 3</span>
      <span class="chip" onclick="setEqs('sin(x)', 'cos(x)')">sin(x) &amp; cos(x)</span>
    </div>

    <button class="action-btn" id="plotBtn" onclick="plot()">رسم نمودارها</button>
  </div>

  <div class="chart-container">
    <canvas id="mathChart"></canvas>
  </div>

  <div class="info-panel" id="infoPanel">
    • محورهای X و Y همدیگر را در مرکز (0,0) به صورت عمودمنصف قطع می‌کنند.<br>
    • با نگه‌داشتن موس یا لمس نمودار، مختصات (x,y) نقطه نمایش داده می‌شود.<br>
    • عبارت xx به عنوان توان دو (x^2) محاسبه می‌شود.
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';

    const translations = {
      fa: {
        title: "📐 رسم‌گر پیشرفته توابع ریاضی",
        labelEq1: "تابع اول f(x):",
        labelEq2: "تابع دوم g(x) (اختیاری):",
        labelExamples: "نمونه‌های سریع:",
        plotBtn: "رسم نمودارها",
        langBtn: "English",
        axisX: "محور X",
        axisY: "محور Y",
        info: "• محورهای X و Y همدیگر را در مرکز (0,0) به صورت عمودمنصف قطع می‌کنند.<br>• با نگه‌داشتن موس یا لمس نمودار، مختصات (x,y) نقطه نمایش داده می‌شود.<br>• عبارت xx به عنوان توان دو (x^2) محاسبه می‌شود.",
        error: "خطا در فرمول! لطفاً عبارت درستی وارد کنید."
      },
      en: {
        title: "📐 Advanced Math Function Plotter",
        labelEq1: "First Function f(x):",
        labelEq2: "Second Function g(x) (Optional):",
        labelExamples: "Quick examples:",
        plotBtn: "Plot Functions",
        langBtn: "فارسی",
        axisX: "X Axis",
        axisY: "Y Axis",
        info: "• X and Y axes intersect symmetrically at (0,0).<br>• Hover/touch to see exact (x,y) coordinates.<br>• 'xx' is automatically parsed as x^2.",
        error: "Invalid formula! Please enter a valid expression."
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('labelEq1').textContent = t.labelEq1;
      document.getElementById('labelEq2').textContent = t.labelEq2;
      document.getElementById('labelExamples').textContent = t.labelExamples;
      document.getElementById('plotBtn').textContent = t.plotBtn;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('infoPanel').innerHTML = t.info;
      
      plot();
    }

    let chart = null;

    function setEqs(eq1, eq2) {
      document.getElementById('equation1').value = eq1;
      document.getElementById('equation2').value = eq2;
      plot();
    }

    function preprocessExpression(expr) {
      if (!expr || !expr.trim()) return null;
      let jsExpr = expr
        .toLowerCase()
        // xx or XX -> x**2
        .replace(/xx/g, 'x**2')
        .replace(/\^/g, '**')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/tan/g, 'Math.tan')
        .replace(/log/g, 'Math.log')
        .replace(/sqrt/g, 'Math.sqrt')
        .replace(/abs/g, 'Math.abs')
        .replace(/pi/g, 'Math.PI')
        .replace(/e/g, 'Math.E')
        // handle 2x, 2X, 2(x), etc.
        .replace(/(\d)([a-z\(])/g, '$1*$2')
        .replace(/([x\)])(\d)/g, '$1*$2');
      return jsExpr;
    }

    function evaluateFunction(rawExpr, x) {
      const processed = preprocessExpression(rawExpr);
      if (!processed) return null;
      try {
        const fn = new Function('x', `try { return ${processed}; } catch(e) { return NaN; }`);
        let val = fn(x);
        return isNaN(val) ? null : val;
      } catch (e) {
        return null;
      }
    }

    function plot() {
      const eq1Str = document.getElementById('equation1').value;
      const eq2Str = document.getElementById('equation2').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';

      const xValues = [];
      const y1Values = [];
      const y2Values = [];
      
      const roots1 = [];
      const roots2 = [];
      const intersections = [];

      try {
        // Generate range from -10 to 10 with step 0.5
        for (let x = -10; x <= 10; x += 0.5) {
          xValues.push(x);
          
          let y1 = evaluateFunction(eq1Str, x);
          let y2 = evaluateFunction(eq2Str, x);
          
          y1Values.push(y1);
          y2Values.push(y2);

          if (y1 !== null && Math.abs(y1) < 0.25) {
            roots1.push({x: x, y: y1});
          }
          if (y2 !== null && Math.abs(y2) < 0.25) {
            roots2.push({x: x, y: y2});
          }

          if (y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.3) {
            intersections.push({x: x, y: (y1 + y2) / 2});
          }
        }

        if (chart) chart.destroy();

        const t = translations[currentLang];
        const ctx = document.getElementById('mathChart').getContext('2d');
        
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: xValues,
            datasets: [
              {
                label: `f(x) = ${eq1Str}`,
                data: y1Values,
                borderColor: '#5288c1',
                backgroundColor: 'rgba(82, 136, 193, 0.1)',
                borderWidth: 2.5,
                pointRadius: 2,
                fill: false,
                tension: 0.2
              },
              eq2Str.trim() ? {
                label: `g(x) = ${eq2Str}`,
                data: y2Values,
                borderColor: '#e06c75',
                backgroundColor: 'rgba(224, 108, 117, 0.1)',
                borderWidth: 2.5,
                pointRadius: 2,
                fill: false,
                tension: 0.2
              } : null,
              {
                label: 'ریشه f(x)',
                data: xValues.map(x => {
                  let match = roots1.find(r => Math.abs(r.x - x) < 0.3);
                  return match ? match.y : null;
                }),
                borderColor: '#98c379',
                backgroundColor: '#98c379',
                pointRadius: 6,
                pointStyle: 'circle',
                showLine: false
              },
              eq2Str.trim() ? {
                label: 'نقطه برخورد',
                data: xValues.map(x => {
                  let match = intersections.find(i => Math.abs(i.x - x) < 0.3);
                  return match ? match.y : null;
                }),
                borderColor: '#e5c07b',
                backgroundColor: '#e5c07b',
                pointRadius: 7,
                pointStyle: 'rectRot',
                showLine: false
              } : null
            ].filter(Boolean)
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              tooltip: {
                callbacks: {
                  label: function(context) {
                    let label = context.dataset.label || '';
                    if (label) {
                      label += ': ';
                    }
                    if (context.parsed.y !== null) {
                      label += `(${context.label}, ${context.parsed.y.toFixed(2)})`;
                    }
                    return label;
                  }
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: t.axisX, color: '#708499' },
                grid: { 
                  color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.08)",
                  lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                },
                ticks: { stepSize: 1, color: '#708499' }
              },
              y: {
                title: { display: true, text: t.axisY, color: '#708499' },
                grid: { 
                  color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.08)",
                  lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                },
                ticks: { color: '#708499' }
              }
            }
          }
        });
      } catch (e) {
        errorEl.textContent = t.error;
      }
    }

    window.onload = function() {
      plot();
    };
  </script>
</body>
</html>
