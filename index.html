<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">جئوجبرا پلاس | GeoGebra Plus</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1e1e2e);
      --text-color: var(--tg-theme-text-color, #cdd6f4);
      --button-color: var(--tg-theme-button-color, #89b4fa);
      --button-text: var(--tg-theme-button-text-color, #11111b);
      --card-bg: var(--tg-theme-secondary-bg-color, #313244);
      --hint-color: var(--tg-theme-hint-color, #6c7086);
      --axis-color: #585b70;
      --grid-color: rgba(88, 91, 112, 0.15);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }
    h2 {
      margin: 0;
      font-size: 1rem;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
      overflow: hidden;
    }
    .canvas-box {
      flex: 1;
      background: #11111b;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls-card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 0 8px;
    }
    .prefix {
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--hint-color);
    }
    input[type="text"] {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 8px 4px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-family: monospace;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--button-color);
    }
    .toolbar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: var(--text-color);
      cursor: pointer;
      white-space: nowrap;
    }
    .tool-btn.active {
      background: var(--button-color);
      color: var(--button-text);
      border-color: transparent;
    }
    .coords-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(17, 17, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      pointer-events: none;
      color: #89b4fa;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 جئوجبرا پلاس | GeoGebra Plus</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN / فارسی</button>
  </div>
  
  <div class="main-container">
    <div class="canvas-box" id="canvasBox">
      <div class="coords-overlay" id="coordsOverlay">x: 0.00, y: 0.00</div>
      <canvas id="geoCanvas"></canvas>
    </div>

    <div class="controls-card">
      <div class="input-row">
        <span class="prefix">f(x) =</span>
        <input type="text" id="eq1" value="a*xx - 4" oninput="draw()" placeholder="a*xx - 4">
      </div>
      <div class="input-row">
        <span class="prefix">g(x) =</span>
        <input type="text" id="eq2" value="2x" oninput="draw()" placeholder="2x">
      </div>

      <div class="slider-row">
        <span id="sliderLabel">a = <span id="aVal">1.0</span></span>
        <input type="range" id="paramA" min="-5" max="5" step="0.5" value="1" oninput="updateA(this.value)">
      </div>

      <div class="toolbar">
        <button class="tool-btn active" id="btnGrid" onclick="toggleTool('grid')">شبکه (Grid)</button>
        <button class="tool-btn active" id="btnDeriv" onclick="toggleTool('deriv')">مشتق f'</button>
        <button class="tool-btn active" id="btnRoots" onclick="toggleTool('roots')">ریشه‌ها</button>
        <button class="tool-btn" id="btnReset" onclick="resetZoom()">مرکز (0,0)</button>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';
    let showGrid = true;
    let showDeriv = true;
    let showRoots = true;
    let paramA = 1;

    // Viewport coordinates
    let scale = 30; // pixels per unit
    let offsetX = 0; // pixel offset from center
    let offsetY = 0;

    let isDragging = false;
    let startX, startY;

    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.getElementById('canvasBox');

    const translations = {
      fa: {
        title: "📐 جئوجبرا پلاس | GeoGebra Plus",
        langBtn: "English",
        grid: "شبکه (Grid)",
        deriv: "مشتق f'",
        roots: "ریشه‌ها",
        reset: "مرکز (0,0)"
      },
      en: {
        title: "📐 GeoGebra Plus",
        langBtn: "فارسی",
        grid: "Grid",
        deriv: "Derivative f'",
        roots: "Roots",
        reset: "Center (0,0)"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('btnGrid').textContent = t.grid;
      document.getElementById('btnDeriv').textContent = t.deriv;
      document.getElementById('btnRoots').textContent = t.roots;
      document.getElementById('btnReset').textContent = t.reset;
      draw();
    }

    function updateA(val) {
      paramA = parseFloat(val);
      document.getElementById('aVal').textContent = paramA;
      draw();
    }

    function toggleTool(tool) {
      if (tool === 'grid') {
        showGrid = !showGrid;
        document.getElementById('btnGrid').classList.toggle('active', showGrid);
      } else if (tool === 'deriv') {
        showDeriv = !showDeriv;
        document.getElementById('btnDeriv').classList.toggle('active', showDeriv);
      } else if (tool === 'roots') {
        showRoots = !showRoots;
        document.getElementById('btnRoots').classList.toggle('active', showRoots);
      }
      draw();
    }

    function resetZoom() {
      scale = 30;
      offsetX = 0;
      offsetY = 0;
      draw();
    }

    function resizeCanvas() {
      canvas.width = box.clientWidth;
      canvas.height = box.clientHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // Mouse / Touch Drag and Zoom
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        draw();
      }
      // Update coords overlay
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const cx = canvas.width / 2 + offsetX;
      const cy = canvas.height / 2 + offsetY;
      const mathX = (px - cx) / scale;
      const mathY = (cy - py) / scale;
      document.getElementById('coordsOverlay').textContent = `x: ${mathX.toFixed(2)}, y: ${mathY.toFixed(2)}`;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomIntensity = 1.1;
      if (e.deltaY < 0) {
        scale *= zoomIntensity;
      } else {
        scale /= zoomIntensity;
      }
      scale = Math.max(10, Math.min(200, scale));
      draw();
    }, { passive: false });

    // Touch support for pinch/pan
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        touchStartX = e.touches[0].clientX - offsetX;
        touchStartY = e.touches[0].clientY - offsetY;
      }
    });
    canvas.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        offsetX = e.touches[0].clientX - touchStartX;
        offsetY = e.touches[0].clientY - touchStartY;
        draw();
      }
    });
    canvas.addEventListener('touchend', () => { isDragging = false; });

    function preprocess(expr) {
      if (!expr || !expr.trim()) return null;
      return expr.toLowerCase()
        .replace(/xx/g, 'x**2')
        .replace(/\^/g, '**')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/tan/g, 'Math.tan')
        .replace(/sqrt/g, 'Math.sqrt')
        .replace(/abs/g, 'Math.abs')
        .replace(/pi/g, 'Math.PI')
        .replace(/e/g, 'Math.E')
        .replace(/(\d)([a-z\(])/g, '$1*$2')
        .replace(/([x\)])(\d)/g, '$1*$2');
    }

    function evalFn(expr, x, a) {
      const p = preprocess(expr);
      if (!p) return null;
      try {
        const fn = new Function('x', 'a', `try { return ${p}; } catch(e) { return NaN; }`);
        let v = fn(x, a);
        return isNaN(v) ? null : v;
      } catch(e) { return null; }
    }

    function derivative(expr, x, a) {
      const h = 0.001;
      let y1 = evalFn(expr, x + h, a);
      let y2 = evalFn(expr, x - h, a);
      if (y1 === null || y2 === null) return null;
      return (y1 - y2) / (2 * h);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2 + offsetX;
      const cy = canvas.height / 2 + offsetY;

      // 1. Draw Grid
      if (showGrid) {
        ctx.strokeStyle = 'rgba(88, 91, 112, 0.2)';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#6c7086';
        ctx.font = '10px monospace';

        // Vertical grid lines
        let startX = cx % scale;
        for (let x = startX; x < canvas.width; x += scale) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();

          let mathX = Math.round((x - cx) / scale);
          if (mathX !== 0) {
            ctx.fillText(mathX, x - 6, cy + 12 > canvas.height - 5 ? canvas.height - 5 : (cy + 12 < 15 ? 15 : cy + 12));
          }
        }

        // Horizontal grid lines
        let startY = cy % scale;
        for (let y = startY; y < canvas.height; y += scale) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();

          let mathY = Math.round((cy - y) / scale);
          if (mathY !== 0) {
            ctx.fillText(mathY, cx + 6 > canvas.width - 20 ? canvas.width - 20 : (cx + 6 < 5 ? 5 : cx + 6), y + 4);
          }
        }
      }

      // 2. Draw Axes
      ctx.strokeStyle = '#a6adc8';
      ctx.lineWidth = 2;

      // X Axis
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(canvas.width, cy);
      ctx.stroke();

      // Y Axis
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, canvas.height);
      ctx.stroke();

      // Origin label
      ctx.fillStyle = '#a6adc8';
      ctx.font = '12px monospace';
      ctx.fillText("0", cx - 12, cy + 14);

      // 3. Plot Functions
      const eq1 = document.getElementById('eq1').value;
      const eq2 = document.getElementById('eq2').value;

      function plotCurve(expr, color, isDash = false) {
        if (!expr.trim()) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.setLineDash(isDash ? [4, 4] : []);
        ctx.beginPath();

        let first = true;
        for (let px = 0; px <= canvas.width; px += 2) {
          let mathX = (px - cx) / scale;
          let mathY = evalFn(expr, mathX, paramA);
          if (mathY === null || isNaN(mathY) || !isFinite(mathY)) {
            first = true;
            continue;
          }
          let py = cy - mathY * scale;

          if (first) {
            ctx.moveTo(px, py);
            first = false;
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Plot f(x)
      plotCurve(eq1, '#89b4fa');
      // Plot g(x)
      plotCurve(eq2, '#f38ba8');

      // Plot Derivative f'(x)
      if (showDeriv) {
        plotCurve((x, a) => {}, '#fab387', true); // custom deriv plot loop below
        ctx.strokeStyle = '#fab387';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        let first = true;
        for (let px = 0; px <= canvas.width; px += 2) {
          let mathX = (px - cx) / scale;
          let dVal = derivative(eq1, mathX, paramA);
          if (dVal === null || isNaN(dVal) || !isFinite(dVal)) {
            first = true;
            continue;
          }
          let py = cy - dVal * scale;
          if (first) { ctx.moveTo(px, py); first = false; }
          else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 4. Plot Roots & Intersections
      if (showRoots) {
        const roots = [];
        const intersections = [];
        for (let px = 0; px <= canvas.width; px += 2) {
          let mathX = (px - cx) / scale;
          let y1 = evalFn(eq1, mathX, paramA);
          let y2 = evalFn(eq2, mathX, paramA);

          if (y1 !== null && Math.abs(y1) < 0.15) {
            roots.push(mathX);
          }
          if (y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.2) {
            intersections.push(mathX);
          }
        }

        // Draw roots (Green dots)
        ctx.fillStyle = '#a6e3a1';
        roots.forEach(rx => {
          let px = cx + rx * scale;
          let py = cy; // y = 0
          ctx.beginPath();
          ctx.arc(px, py, 5, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw intersections (Purple dots)
        ctx.fillStyle = '#cba6f7';
        intersections.forEach(ix => {
          let mathY = evalFn(eq1, ix, paramA);
          if (mathY !== null) {
            let px = cx + ix * scale;
            let py = cy - mathY * scale;
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }
    }

    window.onload = () => {
      resizeCanvas();
    };
  </script>
</body>
</html>
