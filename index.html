<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">جئوجبرا پلاس پرو | GeoGebra Plus Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1e1e2e);
      --text-color: var(--tg-theme-text-color, #cdd6f4);
      --button-color: var(--tg-theme-button-color, #89b4fa);
      --button-text: var(--tg-theme-button-text-color, #11111b);
      --card-bg: var(--tg-theme-secondary-bg-color, #313244);
      --hint-color: var(--tg-theme-hint-color, #6c7086);
      --axis-color: #585b70;
      --grid-color: rgba(88, 91, 112, 0.15);
    }
    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body { display: flex; flex-direction: column; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
    }
    h2 { margin: 0; font-size: 0.95rem; }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .canvas-container {
      width: 100%;
      height: 380px;
      position: relative;
      background: #11111b;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .coords-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(17, 17, 27, 0.85);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      pointer-events: none;
      color: #a6e3a1;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .bottom-panel {
      background: var(--card-bg);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }
    .toolbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: var(--text-color);
      cursor: pointer;
      white-space: nowrap;
    }
    .tool-btn.active { background: var(--button-color); color: var(--button-text); border-color: transparent; }
    
    .input-section { display: flex; flex-direction: column; gap: 6px; }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 0 8px;
    }
    .input-row.focused { border-color: var(--button-color); }
    .prefix { font-family: monospace; color: var(--hint-color); margin-right: 6px; }
    input {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 10px 0;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
    }

    /* Math Keyboard with Parentheses */
    .math-keyboard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #181825;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      box-sizing: border-box;
    }
    .math-keyboard.hidden { display: none; }
    .kb-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-color);
      border-radius: 4px;
      padding: 10px 0;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: monospace;
      text-align: center;
    }
    .kb-btn:active { background: var(--button-color); color: var(--button-text); }
    .kb-btn.num { background: rgba(255,255,255,0.12); font-weight: bold; }
    .kb-btn.action { background: rgba(137, 180, 250, 0.2); color: var(--button-color); }

    /* Analysis Panel */
    .analysis-panel {
      background: #181825;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .analysis-panel.hidden { display: none; }
    .analysis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .analysis-content { font-family: monospace; font-size: 0.8rem; line-height: 1.5; }
    
    /* Authentic Mathematical Sign Table */
    .sign-table-wrapper {
      margin-top: 8px;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
    }
    .sign-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: center;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      overflow: hidden;
    }
    .sign-table th, .sign-table td {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 10px;
      font-weight: bold;
      white-space: nowrap;
    }
    .sign-table th { background: rgba(255,255,255,0.1); color: var(--button-color); }
    .sign-plus { color: #a6e3a1; font-weight: bold; font-size: 1rem; }
    .sign-minus { color: #f38ba8; font-weight: bold; font-size: 1rem; }
    .sign-zero { color: #fab387; font-weight: bold; }
    .sign-undef { color: #f9e2af; font-weight: bold; }
    .close-modal { background: #f38ba8; color: #111; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 جئوجبرا پلاس پرو | GeoGebra Plus Pro</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
  </div>

  <div class="canvas-container" id="canvasBox">
    <div class="coords-overlay" id="coordsOverlay">x: 0.00, y: 0.00</div>
    <canvas id="geoCanvas"></canvas>
  </div>

  <div class="bottom-panel">
    <div class="toolbar">
      <button class="tool-btn active" id="btnGrid" onclick="toggleTool('grid')">شبکه</button>
      <button class="tool-btn active" id="btnRoots" onclick="toggleTool('roots')">ریشه‌ها/برخورد</button>
      <button class="tool-btn" id="btnAnalysis" onclick="toggleAnalysis()">📈 تعیین علامت</button>
      <button class="tool-btn" id="btnKeyboard" onclick="toggleKeyboard()">⌨️ صفحه کلید</button>
      <button class="tool-btn" id="btnReset" onclick="resetZoom()">مرکز</button>
    </div>

    <!-- Analysis Panel -->
    <div class="analysis-panel hidden" id="analysisPanel">
      <div class="analysis-header">
        <span id="analysisTitle">📊 جدول تعیین علامت و تحلیل</span>
        <button class="close-modal" onclick="toggleAnalysis()">✕</button>
      </div>
      <div class="analysis-content" id="analysisContent">
        در حال تحلیل...
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-row" id="row1">
        <span class="prefix">f(x)=</span>
        <input type="text" id="eq1" value="xx - 4" onfocus="setActiveInput('eq1')" oninput="draw()">
      </div>
      <div class="input-row" id="row2">
        <span class="prefix">g(x)=</span>
        <input type="text" id="eq2" value="2x" onfocus="setActiveInput('eq2')" oninput="draw()">
      </div>
    </div>

    <!-- Math Keyboard with Parentheses -->
    <div class="math-keyboard" id="mathKeyboard">
      <button class="kb-btn action" onclick="kbInsert('x')">x</button>
      <button class="kb-btn action" onclick="kbInsert('xx')">x²</button>
      <button class="kb-btn action" onclick="kbInsert('(')">(</button>
      <button class="kb-btn action" onclick="kbInsert(')')">)</button>
      <button class="kb-btn" style="color:#f38ba8; background:rgba(243,139,168,0.15)" onclick="kbBackspace()">⌫</button>

      <button class="kb-btn action" onclick="kbInsert('|')">| |</button>
      <button class="kb-btn action" onclick="kbInsert('√(')">√</button>
      <button class="kb-btn num" onclick="kbInsert('7')">7</button>
      <button class="kb-btn num" onclick="kbInsert('8')">8</button>
      <button class="kb-btn num" onclick="kbInsert('9')">9</button>

      <button class="kb-btn action" onclick="kbInsert('sin(')">sin</button>
      <button class="kb-btn action" onclick="kbInsert('cos(')">cos</button>
      <button class="kb-btn num" onclick="kbInsert('4')">4</button>
      <button class="kb-btn num" onclick="kbInsert('5')">5</button>
      <button class="kb-btn num" onclick="kbInsert('6')">6</button>

      <button class="kb-btn action" onclick="kbInsert('tan(')">tan</button>
      <button class="kb-btn action" onclick="kbInsert('cot(')">cot</button>
      <button class="kb-btn num" onclick="kbInsert('1')">1</button>
      <button class="kb-btn num" onclick="kbInsert('2')">2</button>
      <button class="kb-btn num" onclick="kbInsert('3')">3</button>

      <button class="kb-btn action" onclick="kbInsert('+')">+</button>
      <button class="kb-btn action" onclick="kbInsert('-')">-</button>
      <button class="kb-btn num" onclick="kbInsert('0')">0</button>
      <button class="kb-btn num" onclick="kbInsert('.')">.</button>
      <button class="kb-btn action" onclick="kbInsert('*')">×</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';
    let showGrid = true;
    let showRoots = true;
    let isKeyboardOpen = true;
    let isAnalysisOpen = false;
    let activeInputId = 'eq1';

    let scale = 40;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let startX, startY;
    let hoverPoint = null;

    let initialPinchDistance = null;
    let initialScale = scale;

    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const box = document.getElementById('canvasBox');

    const translations = {
      fa: {
        title: "📐 جئوجبرا پلاس پرو | GeoGebra Plus Pro",
        langBtn: "English",
        grid: "شبکه",
        roots: "ریشه‌ها/برخورد",
        analysis: "📈 تعیین علامت",
        keyboard: "⌨️ صفحه کلید",
        reset: "مرکز",
        analysisTitle: "📊 جدول تعیین علامت و تحلیل",
        rootsLabel: "ریشه‌ها (x): ",
        intersectLabel: "نقاط برخورد (x,y): ",
        noRoots: "ریشه‌ای یافت نشد",
        noIntersect: "برخوردی یافت نشد",
        signTableTitle1: "جدول تعیین علامت برای f(x):",
        signTableTitle2: "جدول تعیین علامت برای g(x):"
      },
      en: {
        title: "📐 GeoGebra Plus Pro",
        langBtn: "فارسی",
        grid: "Grid",
        roots: "Analysis",
        analysis: "📈 Sign Table",
        keyboard: "⌨️ Keyboard",
        reset: "Reset",
        analysisTitle: "📊 Sign Table & Analysis",
        rootsLabel: "Roots (x): ",
        intersectLabel: "Intersections (x,y): ",
        noRoots: "No roots found",
        noIntersect: "No intersections found",
        signTableTitle1: "Sign Table for f(x):",
        signTableTitle2: "Sign Table for g(x):"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('btnGrid').textContent = t.grid;
      document.getElementById('btnRoots').textContent = t.roots;
      document.getElementById('btnAnalysis').textContent = t.analysis;
      document.getElementById('btnKeyboard').textContent = t.keyboard;
      document.getElementById('btnReset').textContent = t.reset;
      document.getElementById('analysisTitle').textContent = t.analysisTitle;
      
      if (isAnalysisOpen) updateAnalysis();
      draw();
    }

    function toggleKeyboard() {
      isKeyboardOpen = !isKeyboardOpen;
      document.getElementById('mathKeyboard').classList.toggle('hidden', !isKeyboardOpen);
    }

    function toggleAnalysis() {
      isAnalysisOpen = !isAnalysisOpen;
      const panel = document.getElementById('analysisPanel');
      panel.classList.toggle('hidden', !isAnalysisOpen);
      if (isAnalysisOpen) updateAnalysis();
    }

    function setActiveInput(id) {
      activeInputId = id;
      document.getElementById('row1').classList.toggle('focused', id === 'eq1');
      document.getElementById('row2').classList.toggle('focused', id === 'eq2');
    }

    document.getElementById('eq1').addEventListener('input', () => { draw(); if (isAnalysisOpen) updateAnalysis(); });
    document.getElementById('eq2').addEventListener('input', () => { draw(); if (isAnalysisOpen) updateAnalysis(); });

    function kbInsert(val) {
      const el = document.getElementById(activeInputId);
      const start = el.selectionStart;
      const end = el.selectionEnd;
      el.value = el.value.substring(0, start) + val + el.value.substring(end);
      el.selectionStart = el.selectionEnd = start + val.length;
      el.focus();
      draw();
      if (isAnalysisOpen) updateAnalysis();
    }

    function kbBackspace() {
      const el = document.getElementById(activeInputId);
      const start = el.selectionStart;
      const end = el.selectionEnd;
      if (start !== end) {
        el.value = el.value.substring(0, start) + el.value.substring(end);
        el.selectionStart = el.selectionEnd = start;
      } else if (start > 0) {
        el.value = el.value.substring(0, start - 1) + el.value.substring(start);
        el.selectionStart = el.selectionEnd = start - 1;
      }
      el.focus();
      draw();
      if (isAnalysisOpen) updateAnalysis();
    }

    function toggleTool(tool) {
      if (tool === 'grid') {
        showGrid = !showGrid;
        document.getElementById('btnGrid').classList.toggle('active', showGrid);
      } else if (tool === 'roots') {
        showRoots = !showRoots;
        document.getElementById('btnRoots').classList.toggle('active', showRoots);
      }
      draw();
    }

    function resetZoom() {
      scale = 40; offsetX = 0; offsetY = 0;
      draw();
    }

    function resizeCanvas() {
      canvas.width = box.clientWidth;
      canvas.height = box.clientHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const cx = canvas.width/2 + offsetX;
      const cy = canvas.height/2 + offsetY;
      const mx = (px - cx) / scale;
      const my = (cy - py) / scale;

      document.getElementById('coordsOverlay').textContent = `x: ${mx.toFixed(2)}, y: ${my.toFixed(2)}`;

      const eq1 = document.getElementById('eq1').value;
      const y1 = evalFn(eq1, mx);
      hoverPoint = y1 !== null ? { x: mx, y: y1 } : null;
      draw();

      if (isDragging) {
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        draw();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - offsetX;
      startY = e.clientY - offsetY;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    function getTouchDistance(e) {
      return Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - offsetX;
        startY = e.touches[0].clientY - offsetY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getTouchDistance(e);
        initialScale = scale;
      }
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (isDragging && e.touches.length === 1) {
        offsetX = e.touches[0].clientX - startX;
        offsetY = e.touches[0].clientY - startY;

        const rect = canvas.getBoundingClientRect();
        const px = e.touches[0].clientX - rect.left;
        const py = e.touches[0].clientY - rect.top;
        const cx = canvas.width/2 + offsetX;
        const cy = canvas.height/2 + offsetY;
        const mx = (px - cx) / scale;
        const my = (cy - py) / scale;
        document.getElementById('coordsOverlay').textContent = `x: ${mx.toFixed(2)}, y: ${my.toFixed(2)}`;

        draw();
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const dist = getTouchDistance(e);
        scale = Math.max(10, Math.min(300, initialScale * (dist / initialPinchDistance)));
        draw();
      }
    }, {passive: false});

    canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDistance = null; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.max(10, Math.min(300, scale * factor));
      draw();
    }, {passive: false});

    function preprocess(expr) {
      if (!expr || !expr.trim()) return null;
      return expr.toLowerCase()
        .replace(/xx/g, 'x**2')
        .replace(/\^/g, '**')
        .replace(/√\(([^)]+)\)/g, 'Math.sqrt($1)')
        .replace(/√(\w+)/g, 'Math.sqrt($1)')
        .replace(/\|([^|]+)\|/g, 'Math.abs($1)')
        .replace(/cot\(([^)]+)\)/g, '(1 / Math.tan($1))')
        .replace(/cot(\w+)/g, '(1 / Math.tan($1))')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/tan/g, 'Math.tan')
        .replace(/(\d)([a-z\(|])/g, '$1*$2')
        .replace(/([x\)])(\d)/g, '$1*$2');
    }

    function evalFn(expr, x) {
      const p = preprocess(expr);
      if (!p) return null;
      try {
        const fn = new Function('x', `return ${p};`);
        let v = fn(x);
        return isFinite(v) ? v : null;
      } catch(e) { return null; }
    }

    // Robust sign table sampling across entire domain
    function generateSignTableHTML(expr, titleText) {
      const rawRoots = [];
      const undefPoints = [];
      
      for (let mx = -20; mx <= 20; mx += 0.02) {
        let y = evalFn(expr, mx);
        if (y === null) {
          undefPoints.push(Number(mx.toFixed(2)));
        } else if (Math.abs(y) < 0.08) {
          rawRoots.push(Number(mx.toFixed(2)));
        }
      }

      const roots = [];
      rawRoots.forEach(r => {
        if (!roots.some(existing => Math.abs(existing - r) < 0.2)) roots.push(r);
      });
      roots.sort((a,b) => a - b);

      const undefs = [];
      undefPoints.forEach(u => {
        if (!undefs.some(existing => Math.abs(existing - u) < 0.25)) undefs.push(u);
      });
      undefs.sort((a,b) => a - b);

      let criticals = [...roots.map(r => ({val: r, type: 'root'})), ...undefs.map(u => ({val: u, type: 'undef'}))];
      criticals.sort((a,b) => a.val - b.val);

      let filteredCriticals = [];
      criticals.forEach(c => {
        if (!filteredCriticals.some(fc => Math.abs(fc.val - c.val) < 0.25)) {
          filteredCriticals.push(c);
        }
      });

      let html = `<b>${titleText}</b><br>`;
      html += `<div class="sign-table-wrapper"><table class="sign-table">`;
      
      html += `<tr><th>x</th><td>-∞</td>`;
      filteredCriticals.forEach(c => {
        html += `<td>${c.val}</td>`;
      });
      html += `<td>+∞</td></tr>`;

      html += `<tr><th>expression</th>`;

      if (filteredCriticals.length === 0) {
        let sampleY = evalFn(expr, 0);
        let sign = (sampleY !== null && sampleY >= 0) ? '<span class="sign-plus">+</span>' : '<span class="sign-minus">-</span>';
        html += `<td>${sign}</td>`;
      } else {
        let intervals = [];
        intervals.push(filteredCriticals[0].val - 1);
        for (let i = 0; i < filteredCriticals.length - 1; i++) {
          intervals.push((filteredCriticals[i].val + filteredCriticals[i+1].val) / 2);
        }
        intervals.push(filteredCriticals[filteredCriticals.length - 1].val + 1);

        for (let i = 0; i < intervals.length; i++) {
          let y = evalFn(expr, intervals[i]);
          let signStr = (y !== null && y > 0) ? '<span class="sign-plus">+</span>' : (y !== null && y < 0 ? '<span class="sign-minus">-</span>' : '<span class="sign-plus">+</span>');
          html += `<td>${signStr}</td>`;
          
          if (i < filteredCriticals.length) {
            let fc = filteredCriticals[i];
            if (fc.type === 'root') {
              html += `<td class="sign-zero">0</td>`;
            } else {
              html += `<td class="sign-undef">||</td>`;
            }
          }
        }
      }

      html += `</tr></table></div><br>`;
      return { html, roots };
    }

    function updateAnalysis() {
      const eq1 = document.getElementById('eq1').value;
      const eq2 = document.getElementById('eq2').value;
      const t = translations[currentLang];

      let fullHtml = "";

      if (eq1.trim()) {
        const res1 = generateSignTableHTML(eq1, t.signTableTitle1);
        fullHtml += `${t.rootsLabel} <b>${res1.roots.length ? res1.roots.join(', ') : t.noRoots}</b><br>`;
        fullHtml += res1.html;
      }

      if (eq2.trim()) {
        const res2 = generateSignTableHTML(eq2, t.signTableTitle2);
        fullHtml += `<br>${t.rootsLabel} <b>${res2.roots.length ? res2.roots.join(', ') : t.noRoots}</b><br>`;
        fullHtml += res2.html;
      }

      if (eq1.trim() && eq2.trim()) {
        const intersections = [];
        for (let mx = -15; mx <= 15; mx += 0.05) {
          let y1 = evalFn(eq1, mx);
          let y2 = evalFn(eq2, mx);
          if (y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.08) {
            intersections.push(`(${mx.toFixed(2)}, ${y1.toFixed(2)})`);
          }
        }
        fullHtml += `${t.intersectLabel} <b>${[...new Set(intersections)].join(', ') || t.noIntersect}</b>`;
      }

      document.getElementById('analysisContent').innerHTML = fullHtml;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width/2 + offsetX;
      const cy = canvas.height/2 + offsetY;

      if (showGrid) {
        ctx.strokeStyle = 'rgba(88, 91, 112, 0.15)';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#6c7086';
        ctx.font = '10px monospace';

        let startX = cx % scale;
        for (let x = startX; x < canvas.width; x += scale) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          let mx = Math.round((x - cx) / scale);
          if (mx !== 0) ctx.fillText(mx, x - 6, cy + 12);
        }

        let startY = cy % scale;
        for (let y = startY; y < canvas.height; y += scale) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
          let my = Math.round((cy - y) / scale);
          if (my !== 0) ctx.fillText(my, cx + 6, y + 4);
        }
      }

      ctx.strokeStyle = '#a6adc8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

      const eq1 = document.getElementById('eq1'.trim()).value;
      const eq2 = document.getElementById('eq2').value;

      function plot(expr, color) {
        if (!expr.trim()) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        let first = true;
        for (let px = 0; px <= canvas.width; px += 1) {
          let mx = (px - cx) / scale;
          let my = evalFn(expr, mx);
          if (my === null) { first = true; continue; }
          let py = cy - my * scale;
          if (first) { ctx.moveTo(px, py); first = false; }
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      plot(eq1, '#89b4fa');
      plot(eq2, '#f38ba8');

      if (showRoots) {
        const step = 0.1;
        for (let mx = -canvas.width/(2*scale)-offsetX/scale; mx <= canvas.width/(2*scale)-offsetX/scale; mx += step) {
          let y1 = evalFn(eq1, mx);
          let y2 = evalFn(eq2, mx);

          if (y1 !== null && Math.abs(y1) < 0.1) {
            ctx.fillStyle = '#a6e3a1';
            ctx.beginPath(); ctx.arc(cx + mx * scale, cy, 5, 0, 7); ctx.fill();
          }
          if (y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.15) {
            ctx.fillStyle = '#cba6f7';
            ctx.beginPath(); ctx.arc(cx + mx * scale, cy - y1 * scale, 6, 0, 7); ctx.fill();
          }
        }
      }

      if (hoverPoint) {
        let px = cx + hoverPoint.x * scale;
        let py = cy - hoverPoint.y * scale;

        ctx.fillStyle = '#fab387';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = 'rgba(17, 17, 27, 0.9)';
        ctx.fillRect(px + 10, py - 25, 90, 22);
        ctx.strokeStyle = '#fab387';
        ctx.strokeRect(px + 10, py - 25, 90, 22);

        ctx.fillStyle = '#fab387';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`(${hoverPoint.x.toFixed(2)}, ${hoverPoint.y.verted ? '' : hoverPoint.y.toFixed(2)})`, px + 14, py - 10);
      }
    }

    setActiveInput('eq1');
    window.onload = resizeCanvas;
  </script>
</body>
</html>
