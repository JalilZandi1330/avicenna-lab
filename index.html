<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">مینی جئوجبرا پیشرفته | GeoGebra Mini Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #5288c1);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --hint-color: var(--tg-theme-hint-color, #708499);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    label {
      font-size: 0.85rem;
      font-weight: bold;
    }
    .input-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 0 8px;
    }
    .prefix {
      font-family: monospace;
      font-size: 1rem;
      color: var(--hint-color);
      margin-left: 4px;
      margin-right: 4px;
    }
    input[type="text"] {
      background: transparent;
      border: none;
      color: var(--text-color);
      padding: 8px 0;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-family: monospace;
      direction: ltr;
      text-align: left;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--button-color);
    }
    .slider-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0,0,0,0.15);
      padding: 8px;
      border-radius: 6px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-family: monospace;
    }
    button.action-btn {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.action-btn:active {
      opacity: 0.8;
    }
    .chart-container {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 10px;
      position: relative;
      height: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 0.8rem;
      text-align: center;
      min-height: 16px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .feature-toggle {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px;
      font-size: 0.8rem;
      color: var(--text-color);
      cursor: pointer;
      text-align: center;
    }
    .feature-toggle.active {
      background: var(--button-color);
      border-color: transparent;
    }
    .stats-panel {
      font-size: 0.75rem;
      color: var(--hint-color);
      background: rgba(0,0,0,0.2);
      padding: 6px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 id="appTitle">📐 مینی جئوجبرا پیشرفته | GeoGebra Mini Pro</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN / فارسی</button>
  </div>
  
  <div class="card">
    <label id="labelEq1" for="equation1">تابع اول f(x):</label>
    <div class="input-row">
      <span class="prefix">f(x) =</span>
      <input type="text" id="equation1" value="a*xx - 4" placeholder="a*xx - 4">
    </div>

    <div class="slider-box">
      <div class="slider-header">
        <span id="sliderALabel">پارامتر a:</span>
        <span id="sliderAVal">1.0</span>
      </div>
      <input type="range" id="paramA" min="-5" max="5" step="0.5" value="1" oninput="updateSlider(this.value)">
    </div>

    <label id="labelEq2" for="equation2">تابع دوم g(x) (اختیاری):</label>
    <div class="input-row">
      <span class="prefix">g(x) =</span>
      <input type="text" id="equation2" value="2x" placeholder="2x">
    </div>

    <div class="features-grid">
      <button class="feature-toggle active" id="btnDeriv" onclick="toggleFeature('deriv')">مشتق f'(x)</button>
      <button class="feature-toggle" id="btnIntegral" onclick="toggleFeature('integral')">انتگرال (مساحت)</button>
      <button class="feature-toggle" id="btnExtrema" onclick="toggleFeature('extrema')">مینیمم / ماکزیمم</button>
      <button class="feature-toggle active" id="btnRoots" onclick="toggleFeature('roots')">ریشه‌ها و تقاطع</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button class="action-btn" id="plotBtn" onclick="plot()">به‌روزرسانی نمودار</button>
  </div>

  <div class="chart-container">
    <canvas id="mathChart"></canvas>
  </div>

  <div class="stats-panel" id="statsPanel">
    <span id="statRoots">Roots: -</span>
    <span id="statIntersections">Intersections: -</span>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let currentLang = 'fa';
    let showDeriv = true;
    let showIntegral = false;
    let showExtrema = false;
    let showRoots = true;
    let paramA = 1;

    const translations = {
      fa: {
        title: "📐 مینی جئوجبرا پیشرفته | GeoGebra Mini Pro",
        labelEq1: "تابع اول f(x):",
        labelEq2: "تابع دوم g(x) (اختیاری):",
        sliderALabel: "پارامتر a:",
        plotBtn: "به‌روزرسانی نمودار",
        langBtn: "English",
        axisX: "محور X",
        axisY: "محور Y",
        btnDeriv: "مشتق f'(x)",
        btnIntegral: "انتگرال (مساحت)",
        btnExtrema: "مینیمم / ماکزیمم",
        btnRoots: "ریشه‌ها و تقاطع",
        rootLabel: "ریشه f(x)",
        intersectLabel: "نقطه برخورد",
        extremaLabel: "اکسترمم (قله/دره)",
        derivLabel: "مشتق f'(x)",
        integralLabel: "انتگرال ∫ f(x)",
        error: "خطا در فرمول! لطفاً عبارت درستی وارد کنید."
      },
      en: {
        title: "📐 GeoGebra Mini Pro",
        labelEq1: "First Function f(x):",
        labelEq2: "Second Function g(x) (Optional):",
        sliderALabel: "Parameter a:",
        plotBtn: "Update Plot",
        langBtn: "فارسی",
        axisX: "X Axis",
        axisY: "Y Axis",
        btnDeriv: "Derivative f'(x)",
        btnIntegral: "Integral (Area)",
        btnExtrema: "Extrema (Min/Max)",
        btnRoots: "Roots & Intersections",
        rootLabel: "Root of f(x)",
        intersectLabel: "Intersection",
        extremaLabel: "Extrema",
        derivLabel: "Derivative f'(x)",
        integralLabel: "Integral ∫ f(x)",
        error: "Invalid formula! Please enter a valid expression."
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const t = translations[currentLang];
      
      document.getElementById('htmlRoot').setAttribute('lang', currentLang);
      document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('appTitle').textContent = t.title;
      document.getElementById('labelEq1').textContent = t.labelEq1;
      document.getElementById('labelEq2').textContent = t.labelEq2;
      document.getElementById('sliderALabel').textContent = t.sliderALabel;
      document.getElementById('plotBtn').textContent = t.plotBtn;
      document.getElementById('langBtn').textContent = t.langBtn;
      document.getElementById('btnDeriv').textContent = t.btnDeriv;
      document.getElementById('btnIntegral').textContent = t.btnIntegral;
      document.getElementById('btnExtrema').textContent = t.btnExtrema;
      document.getElementById('btnRoots').textContent = t.btnRoots;
      
      plot();
    }

    function updateSlider(val) {
      paramA = parseFloat(val);
      document.getElementById('sliderAVal').textContent = paramA;
      plot();
    }

    function toggleFeature(feat) {
      if (feat === 'deriv') {
        showDeriv = !showDeriv;
        document.getElementById('btnDeriv').classList.toggle('active', showDeriv);
      } else if (feat === 'integral') {
        showIntegral = !showIntegral;
        document.getElementById('btnIntegral').classList.toggle('active', showIntegral);
      } else if (feat === 'extrema') {
        showExtrema = !showExtrema;
        document.getElementById('btnExtrema').classList.toggle('active', showExtrema);
      } else if (feat === 'roots') {
        showRoots = !showRoots;
        document.getElementById('btnRoots').classList.toggle('active', showRoots);
      }
      plot();
    }

    let chart = null;

    function preprocessExpression(expr) {
      if (!expr || !expr.trim()) return null;
      let jsExpr = expr
        .toLowerCase()
        .replace(/xx/g, 'x**2')
        .replace(/\^/g, '**')
        .replace(/sin/g, 'Math.sin')
        .replace(/cos/g, 'Math.cos')
        .replace(/tan/g, 'Math.tan')
        .replace(/log/g, 'Math.log')
        .replace(/sqrt/g, 'Math.sqrt')
        .replace(/abs/g, 'Math.abs')
        .replace(/pi/g, 'Math.PI')
        .replace(/e/g, 'Math.E')
        .replace(/(\d)([a-z\(])/g, '$1*$2')
        .replace(/([x\)])(\d)/g, '$1*$2');
      return jsExpr;
    }

    function evaluateFunction(rawExpr, x, a) {
      const processed = preprocessExpression(rawExpr);
      if (!processed) return null;
      try {
        const fn = new Function('x', 'a', `try { return ${processed}; } catch(e) { return NaN; }`);
        let val = fn(x, a);
        return isNaN(val) ? null : val;
      } catch (e) {
        return null;
      }
    }

    function derivative(rawExpr, x, a) {
      const h = 0.001;
      let y1 = evaluateFunction(rawExpr, x + h, a);
      let y2 = evaluateFunction(rawExpr, x - h, a);
      if (y1 === null || y2 === null) return null;
      return (y1 - y2) / (2 * h);
    }

    function plot() {
      const eq1Str = document.getElementById('equation1').value;
      const eq2Str = document.getElementById('equation2').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';

      const xValues = [];
      const y1Values = [];
      const y2Values = [];
      const derivValues = [];
      const integralValues = [];
      
      const roots1 = [];
      const intersections = [];
      const extremas = [];

      try {
        let prevY = null;
        let prevDeriv = null;

        for (let x = -10; x <= 10; x += 0.25) {
          xValues.push(x);
          
          let y1 = evaluateFunction(eq1Str, x, paramA);
          let y2 = evaluateFunction(eq2Str, x, paramA);
          let d1 = showDeriv ? derivative(eq1Str, x, paramA) : null;
          
          y1Values.push(y1);
          y2Values.push(y2);
          derivValues.push(d1);
          
          if (showIntegral && y1 !== null) {
            integralValues.push(y1);
          } else {
            integralValues.push(null);
          }

          // Roots
          if (showRoots && y1 !== null && Math.abs(y1) < 0.2) {
            roots1.push({x: Number(x.toFixed(2)), y: y1});
          }

          // Intersections
          if (showRoots && y1 !== null && y2 !== null && Math.abs(y1 - y2) < 0.25) {
            intersections.push({x: Number(x.toFixed(2)), y: (y1 + y2) / 2});
          }

          // Extrema (where derivative crosses zero)
          if (showExtrema && prevDeriv !== null && d1 !== null) {
            if (prevDeriv * d1 <= 0) {
              extremas.push({x: Number(x.toFixed(2)), y: y1});
            }
          }
          prevDeriv = d1;
        }

        // Update stats panel
        const t = translations[currentLang];
        document.getElementById('statRoots').textContent = `Roots: ${roots1.map(r => r.x).join(', ') || 'None'}`;
        document.getElementById('statIntersections').textContent = `Intersections: ${intersections.map(i => '('+i.x+','+i.y.toFixed(1)+')').join(', ') || 'None'}`;

        if (chart) chart.destroy();

        const ctx = document.getElementById('mathChart').getContext('2d');
        
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: xValues,
            datasets: [
              {
                label: `f(x) = ${eq1Str} (a=${paramA})`,
                data: y1Values,
                borderColor: '#5288c1',
                backgroundColor: 'rgba(82, 136, 193, 0.1)',
                borderWidth: 3,
                pointRadius: 1,
                fill: false,
                tension: 0.2
              },
              eq2Str.trim() ? {
                label: `g(x) = ${eq2Str}`,
                data: y2Values,
                borderColor: '#e06c75',
                backgroundColor: 'rgba(224, 108, 117, 0.1)',
                borderWidth: 2.5,
                pointRadius: 1,
                fill: false,
                tension: 0.2
              } : null,
              showDeriv ? {
                label: t.derivLabel,
                data: derivValues,
                borderColor: '#e5c07b',
                borderWidth: 2,
                borderDash: [4, 4],
                pointRadius: 0,
                fill: false,
                tension: 0.2
              } : null,
              showIntegral ? {
                label: t.integralLabel,
                data: integralValues,
                backgroundColor: 'rgba(152, 195, 121, 0.25)',
                borderColor: 'transparent',
                borderWidth: 0,
                fill: true,
                pointRadius: 0,
                tension: 0.2
              } : null,
              showRoots ? {
                label: t.rootLabel,
                data: xValues.map(x => {
                  let match = roots1.find(r => Math.abs(r.x - x) < 0.2);
                  return match ? match.y : null;
                }),
                borderColor: '#98c379',
                backgroundColor: '#98c379',
                pointRadius: 6,
                pointStyle: 'circle',
                showLine: false
              } : null,
              showRoots && eq2Str.trim() ? {
                label: t.intersectLabel,
                data: xValues.map(x => {
                  let match = intersections.find(i => Math.abs(i.x - x) < 0.2);
                  return match ? match.y : null;
                }),
                borderColor: '#c678dd',
                backgroundColor: '#c678dd',
                pointRadius: 7,
                pointStyle: 'rectRot',
                showLine: false
              } : null,
              showExtrema ? {
                label: t.extremaLabel,
                data: xValues.map(x => {
                  let match = extremas.find(e => Math.abs(e.x - x) < 0.2);
                  return match ? match.y : null;
                }),
                borderColor: '#d19a66',
                backgroundColor: '#d19a66',
                pointRadius: 7,
                pointStyle: 'triangle',
                showLine: false
              } : null
            ].filter(Boolean)
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              tooltip: {
                callbacks: {
                  label: function(context) {
                    let label = context.dataset.label || '';
                    if (label) label += ': ';
                    if (context.parsed.y !== null) {
                      label += `(${context.label}, ${context.parsed.y.toFixed(2)})`;
                    }
                    return label;
                  }
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: t.axisX, color: '#708499' },
                grid: { 
                  color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.08)",
                  lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                },
                ticks: { stepSize: 1, color: '#708499' }
              },
              y: {
                title: { display: true, text: t.axisY, color: '#708499' },
                grid: { 
                  color: (context) => context.tick.value === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.08)",
                  lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                },
                ticks: { color: '#708499' }
              }
            }
          }
        });
      } catch (e) {
        errorEl.textContent = t.error;
      }
    }

    window.onload = function() {
      plot();
    };
  </script>
</body>
</html>
